spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5433}/${DB_NAME:ecommerce_user}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${SERVER_PORT:8084}

jwt:
  secret: ${JWT_SECRET:my-super-secret-key-that-must-be-at-least-256-bits-long-for-HS256-algorithm}

management:
  endpoints:
    web:
      exposure:
        include: health,info

