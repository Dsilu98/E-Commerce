spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-route
          uri: http://${AUTH_SERVICE_HOST:auth-service}:${AUTH_SERVICE_PORT:8081}
          predicates:
            - Path=/auth/**
        - id: product-route
          uri: http://${PRODUCT_SERVICE_HOST:product-service}:${PRODUCT_SERVICE_PORT:8082}
          predicates:
            - Path=/products/**
        - id: order-route
          uri: http://${ORDER_SERVICE_HOST:order-service}:${ORDER_SERVICE_PORT:8083}
          predicates:
            - Path=/orders/**
        - id: user-route
          uri: http://${USER_SERVICE_HOST:user-service}:${USER_SERVICE_PORT:8084}
          predicates:
            - Path=/users/**

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

