spring:
  application:
    name: product-service
  datasource:
    url: jdbc:postgresql://localhost:5433/ecommerce_product
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  redis:
    host: localhost
    port: 6379
    database: 0
  cache:
    type: redis
    redis:
      time-to-live: 30000

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  metrics:
    export:
      prometheus:
        enabled: true

